<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Barbeiros - Barbearia</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="cabecalho">
    <div class="barbeiro">Painel Administrativo</div>
    <h1>Barbearia</h1>
    <p>Gerencie os barbeiros</p>
</header>

<main class="conteudo conteudo-largo">
    <h2 class="titulo-menu">Novo barbeiro</h2>

    <form th:action="@{/barbeiros/salvar}" method="post" class="formulario-agendamento">
        <div class="form-grupo">
            <label class="form-label" for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" class="form-control" required />
        </div>
        <div class="form-grupo">
            <label class="form-label" for="especialidade">Especialidade:</label>
            <input type="text" id="especialidade" name="especialidade" class="form-control" placeholder="Ex: Degradê, Barba" />
        </div>
        <br>
        <button type="submit" class="botao-menu">Salvar barbeiro</button>
    </form>

    <h2 class="titulo-menu" style="margin-top: 30px;">Barbeiros cadastrados</h2>

    <div class="lista-vazia" th:if="${#lists.isEmpty(barbeiros)}">
        <p>Nenhum barbeiro cadastrado ainda.</p>
    </div>

    <div class="tabela-wrapper" th:unless="${#lists.isEmpty(barbeiros)}">
        <table class="tabela-clientes">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Especialidade</th>
                <th class="col-acoes">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${barbeiros}">
                <td th:text="${b.nome}"></td>
                <td th:text="${b.especialidade}"></td>
                <td class="col-acoes">
                    <form th:action="@{/barbeiros/deletar/{id}(id=${b.id})}" method="post"
                          onsubmit="return confirm('Excluir este barbeiro?');">
                        <button type="submit" class="btn-excluir">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="link-voltar">
        <a th:href="@{/clientes}">← Voltar</a>
    </div>
</main>

</body>
</html>
