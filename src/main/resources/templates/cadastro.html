<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta - Barbearia</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="cabecalho">
    <h1>Barbearia</h1>
    <p>Crie sua conta</p>
</header>

<main class="conteudo">
    <h2 class="titulo-menu">Criar conta</h2>

    <div class="alerta-erro" th:if="${erro}" th:text="${erro}"></div>

    <form th:action="@{/cadastro}" method="post" class="formulario-agendamento">
        <div class="form-grupo">
            <label class="form-label" for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" class="form-control" required />
        </div>

        <div class="form-grupo">
            <label class="form-label" for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000" />
        </div>

        <div class="form-grupo">
            <label class="form-label" for="email">E-mail:</label>
            <input type="email" id="email" name="email" class="form-control" required />
        </div>

        <div class="form-grupo">
            <label class="form-label" for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" class="form-control" minlength="6" required />
        </div>

        <br>
        <button type="submit" class="botao-menu">Criar conta</button>
    </form>

    <div class="link-voltar">
        <a th:href="@{/login}">Já tem conta? Entrar</a>
    </div>
</main>

</body>
</html>
